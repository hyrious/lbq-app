<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Image Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar">Image Portal</header>
  <div id="drop-area" class="drop-area">
    <div id="drop-surface" class="drop-surface">
      <p class="placeholder">Drop or paste an image</p>
    </div>
  </div>
  <div id="preview-panel" class="preview hidden">
    <img id="preview" alt="Image preview">
    <div class="toolbar">
      <span id="dimension" class="dimension"></span>
      <input id="scale" class="scale" inputmode="decimal" placeholder="1.0" aria-label="Scale">
      <button id="resize" class="action" type="button">Resize</button>
      <button id="close" class="action icon" type="button" aria-label="Close preview">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5l5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6Z"/></svg>
      </button>
    </div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="renderer.ts"></script>
</body>
</html>
